name: football-bot

on:
  schedule:
    # 09:05, 13:05 и 20:05 по Бразилии (UTC-3)
    - cron: "5 12,16,23 * * *"
  workflow_dispatch:

concurrency:
  group: football-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post news
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FOOTER: ${{ secrets.FOOTER }}
        run: python bot.py --once
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push)
